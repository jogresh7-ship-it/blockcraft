<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Blockcraft</title>
<style>
:root{--bg:#000;--fg:#ddd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--fg:#ddd}}
:root[data-theme="dark"]{--bg:#000;--fg:#ddd}
html,body{margin:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#pre{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:14px ui-monospace,Menlo,monospace;color:var(--fg);background:#2b1d10}
#packfile{display:none}
</style></head><body>
<canvas id="gl"></canvas><canvas id="ui"></canvas>
<div id="pre">Loading...</div>
<input type="file" id="packfile" accept=".zip,application/zip"><input type="file" id="modfile" accept=".js,.zip" style="display:none"><input type="file" id="texfile" accept=".zip,application/zip" style="display:none">
<script src="js/registry.js"></script><script src="js/core.js"></script><script src="js/world.js"></script><script src="js/gui.js"></script><script src="js/sound.js"></script>
<script src="js/data.js"></script><script src="js/redstone.js"></script><script src="js/physics.js"></script><script src="js/input.js"></script><script src="js/screens.js"></script><script src="js/packs.js"></script><script src="js/market.js"></script><script src="js/mods.js"></script><script src="js/main.js"></script>
</body></html>
